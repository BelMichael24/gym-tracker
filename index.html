<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#121212">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Gym Tracker</title>
  <style>
    :root {
      --bg: #121212;
      --card: #1e1e1e;
      --card-border: #2e2e2e;
      --accent: #bb86fc;
      --accent-hover: #9955e8;
      --text: #ffffff;
      --text-dim: #a0a0a0;
      --danger: #cf6679;
      --success: #03dac6;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 16px; padding-bottom: 90px; -webkit-tap-highlight-color: transparent; }

    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid var(--card-border); padding-bottom: 12px; }
    h1 { font-size: 1.4rem; color: var(--accent); font-weight: 700; }

    .nav-tabs { display: flex; gap: 8px; margin-bottom: 20px; }
    .tab-btn { flex: 1; background: var(--card); border: 1px solid var(--card-border); color: var(--text-dim); padding: 10px; border-radius: 8px; font-weight: 600; font-size: 0.9rem; text-align: center; }
    .tab-btn.active { background: var(--accent); color: #000; border-color: var(--accent); }

    .card { background: var(--card); border: 1px solid var(--card-border); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
    .card-title { font-size: 1.1rem; margin-bottom: 12px; color: var(--text); display: flex; justify-content: space-between; align-items: center; }
    
    .set-row { display: grid; grid-template-columns: 2fr 1fr 1fr 40px; gap: 8px; align-items: center; margin-bottom: 8px; }
    input { background: #2a2a2a; border: 1px solid var(--card-border); color: #fff; padding: 8px; border-radius: 6px; font-size: 0.9rem; width: 100%; text-align: center; }
    input[type="text"] { text-align: left; }
    input:focus { border-color: var(--accent); outline: none; }

    .btn { background: var(--accent); color: #000; border: none; padding: 12px; border-radius: 8px; font-weight: bold; width: 100%; font-size: 0.95rem; margin-top: 8px; }
    .btn:active { opacity: 0.8; }
    .btn-secondary { background: #2a2a2a; color: var(--text-dim); border: 1px solid var(--card-border); margin-top: 4px; }
    .btn-del { background: transparent; color: var(--danger); font-size: 1.2rem; border: none; height: 36px; cursor: pointer; }
    .btn-delete-log { background: transparent; color: var(--danger); border: 1px solid var(--danger); padding: 4px 10px; border-radius: 6px; font-size: 0.75rem; font-weight: 600; cursor: pointer; }

    /* Timer Bar */
    .timer-bar { position: fixed; bottom: 0; left: 0; right: 0; background: #1f1f1f; border-top: 1px solid var(--card-border); padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; }
    .timer-display { font-size: 1.2rem; font-weight: bold; color: var(--success); font-mono: monospace; }
    .timer-btn { background: var(--card-border); color: var(--text); border: none; padding: 8px 14px; border-radius: 6px; font-size: 0.85rem; font-weight: 600; }

    .history-item { border-bottom: 1px solid var(--card-border); padding: 10px 0; }
    .history-item:last-child { border-bottom: none; }
    .history-date { font-size: 0.75rem; color: var(--text-dim); margin-bottom: 4px; }
  </style>
</head>
<body>

  <header>
    <h1>GYM TRACKER</h1>
  </header>

  <!-- Navigation Tabs -->
  <div class="nav-tabs">
    <button class="tab-btn active" onclick="switchTab('workout')">Today's Workout</button>
    <button class="tab-btn" onclick="switchTab('history')">History</button>
  </div>

  <!-- Dynamic Content Container -->
  <div id="workoutContainer"></div>

  <!-- Bottom Rest Timer Bar -->
  <div class="timer-bar">
    <div>
      <span style="font-size:0.75rem; color:var(--text-dim); display:block;">REST TIMER</span>
      <span class="timer-display" id="timerText">01:30</span>
    </div>
    <div style="display:flex; gap:8px;">
      <button class="timer-btn" onclick="startTimer(60)">60s</button>
      <button class="timer-btn" onclick="startTimer(90)">90s</button>
      <button class="timer-btn" onclick="resetTimer()">Stop</button>
    </div>
  </div>

  <script>
    // Initial Default Single-Day Routine
    const defaultExercises = ["Bench Press", "Barbell Squat", "Barbell Row", "Overhead Press"];

    let currentTab = 'workout';
    let timerInterval = null;

    // Load Routine state
    function getExercises() {
      const saved = localStorage.getItem('gt_single_routine');
      return saved ? JSON.parse(saved) : defaultExercises;
    }

    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
      render();
    }

    function render() {
      const container = document.getElementById('workoutContainer');
      container.innerHTML = '';

      if (currentTab === 'history') {
        renderHistory(container);
        return;
      }

      const exercises = getExercises();

      let html = `<form id="workoutForm" onsubmit="saveWorkout(event)">`;
      
      exercises.forEach((ex, exIndex) => {
        html += `
          <div class="card">
            <div class="card-title">
              <span>${ex}</span>
              <button type="button" class="btn-del" onclick="removeExercise(${exIndex})">✕</button>
            </div>
            <div style="display:grid; grid-template-columns: 2fr 1fr 1fr; gap:8px; margin-bottom:6px; font-size:0.75rem; color:var(--text-dim);">
              <span>Exercise / Set</span><span>Kg</span><span>Reps</span>
            </div>
            <div class="set-row">
              <input type="text" value="Set 1" readonly>
              <input type="number" step="0.5" name="${ex}_w1" placeholder="0">
              <input type="number" name="${ex}_r1" placeholder="0">
            </div>
            <div class="set-row">
              <input type="text" value="Set 2" readonly>
              <input type="number" step="0.5" name="${ex}_w2" placeholder="0">
              <input type="number" name="${ex}_r2" placeholder="0">
            </div>
            <div class="set-row">
              <input type="text" value="Set 3" readonly>
              <input type="number" step="0.5" name="${ex}_w3" placeholder="0">
              <input type="number" name="${ex}_r3" placeholder="0">
            </div>
          </div>
        `;
      });

      html += `
        <button type="button" class="btn btn-secondary" onclick="addExercise()">+ Add Exercise</button>
        <button type="submit" class="btn" style="margin-top:16px;">Finish & Save Workout</button>
      </form>`;

      container.innerHTML = html;
    }

    function addExercise() {
      const name = prompt("Enter Exercise Name:");
      if (!name) return;
      const exercises = getExercises();
      exercises.push(name);
      localStorage.setItem('gt_single_routine', JSON.stringify(exercises));
      render();
    }

    function removeExercise(index) {
      if (!confirm("Remove this exercise from your template?")) return;
      const exercises = getExercises();
      exercises.splice(index, 1);
      localStorage.setItem('gt_single_routine', JSON.stringify(exercises));
      render();
    }

    function saveWorkout(e) {
      e.preventDefault();
      const formData = new FormData(e.target);
      const log = {
        id: Date.now(),
        date: new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }),
        entries: []
      };

      const exercises = getExercises();
      exercises.forEach(ex => {
        const sets = [];
        for (let i = 1; i <= 3; i++) {
          const w = formData.get(`${ex}_w${i}`);
          const r = formData.get(`${ex}_r${i}`);
          if (w || r) sets.push({ weight: w || 0, reps: r || 0 });
        }
        if (sets.length > 0) log.entries.push({ exercise: ex, sets });
      });

      if (log.entries.length === 0) {
        alert("Please log at least one set before saving.");
        return;
      }

      const history = JSON.parse(localStorage.getItem('ns_history') || '[]');
      history.unshift(log);
      localStorage.setItem('ns_history', JSON.stringify(history));

      alert("Workout saved successfully!");
      switchTab('history');
    }

    function deleteHistoryItem(id) {
      if (!confirm("Are you sure you want to delete this workout entry?")) return;
      let history = JSON.parse(localStorage.getItem('ns_history') || '[]');
      history = history.filter(item => item.id !== id);
      localStorage.setItem('ns_history', JSON.stringify(history));
      renderHistory(document.getElementById('workoutContainer'));
    }

    function renderHistory(container) {
      const history = JSON.parse(localStorage.getItem('ns_history') || '[]');
      if (history.length === 0) {
        container.innerHTML = `<div class="card"><p style="color:var(--text-dim); text-align:center;">No logged workouts yet.</p></div>`;
        return;
      }

      let html = '';
      history.forEach(item => {
        html += `
          <div class="card">
            <div class="card-title">
              <div>
                <span>WORKOUT SESSION</span>
                <div class="history-date">${item.date}</div>
              </div>
              <button class="btn-delete-log" onclick="deleteHistoryItem(${item.id})">Delete</button>
            </div>`;
        item.entries.forEach(entry => {
          const setStr = entry.sets.map(s => `${s.weight}kg × ${s.reps}`).join(' | ');
          html += `
            <div class="history-item">
              <strong style="font-size:0.9rem; color:var(--accent);">${entry.exercise}</strong>
              <div style="font-size:0.85rem; color:var(--text-dim); margin-top:2px;">${setStr}</div>
            </div>`;
        });
        html += `</div>`;
      });
      container.innerHTML = html;
    }

    // Timer functionality
    function startTimer(seconds) {
      clearInterval(timerInterval);
      let timeLeft = seconds;
      updateTimerDisplay(timeLeft);

      timerInterval = setInterval(() => {
        timeLeft--;
        updateTimerDisplay(timeLeft);
        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
        }
      }, 1000);
    }

    function resetTimer() {
      clearInterval(timerInterval);
      updateTimerDisplay(90);
    }

    function updateTimerDisplay(s) {
      const mins = Math.floor(s / 60).toString().padStart(2, '0');
      const secs = (s % 60).toString().padStart(2, '0');
      document.getElementById('timerText').innerText = `${mins}:${secs}`;
    }

    // Initial Load
    render();
  </script>
</body>
</html>
