<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Jacked.</title>
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --card-bg-subtle: #2a2a2a;
      --accent-color: #bb86fc;
      --accent-hover: #9965f4;
      --text-main: #ffffff;
      --text-muted: #a0a0a0;
      --border-color: #333333;
      --danger-color: #cf6679;
    }

    /* Themes */
    [data-theme="midnight"] {
      --bg-color: #0b0e14;
      --card-bg: #151a21;
      --card-bg-subtle: #1f2633;
      --accent-color: #4f46e5;
      --accent-hover: #4338ca;
      --border-color: #2a3447;
    }

    [data-theme="emerald"] {
      --bg-color: #06140e;
      --card-bg: #0c2419;
      --card-bg-subtle: #133827;
      --accent-color: #10b981;
      --accent-hover: #059669;
      --border-color: #1b4d35;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      padding-bottom: 80px;
    }

    header {
      padding: 16px;
      background-color: var(--card-bg);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    h1 {
      font-size: 1.4rem;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    h1 span {
      color: var(--accent-color);
    }

    .theme-select {
      background-color: var(--card-bg-subtle);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 0.85rem;
    }

    .container {
      padding: 16px;
      max-width: 600px;
      margin: 0 auto;
      width: 100%;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .card-title {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .input-group {
      display: flex;
      gap: 8px;
    }

    input, select, button {
      outline: none;
      font-size: 1rem;
    }

    input[type="text"], input[type="number"] {
      background-color: var(--card-bg-subtle);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 10px 12px;
      border-radius: 8px;
      width: 100%;
    }

    .btn {
      background-color: var(--accent-color);
      color: #fff;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-danger {
      background: transparent;
      color: var(--danger-color);
      border: 1px solid var(--danger-color);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 0.8rem;
    }

    /* Sets Layout */
    .set-row {
      display: grid;
      grid-template-columns: 32px 1fr 1fr 32px;
      gap: 8px;
      align-items: center;
      margin-bottom: 8px;
    }

    .set-num {
      font-weight: 700;
      color: var(--text-muted);
      text-align: center;
    }

    /* Rest Timer Bar */
    .timer-bar {
      background-color: var(--card-bg-subtle);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    /* Canvas Chart */
    .chart-container {
      width: 100%;
      height: 200px;
      margin-top: 8px;
    }

    canvas {
      width: 100% !important;
      height: 100% !important;
    }

    /* Calendar Grid */
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
      text-align: center;
      margin-top: 10px;
    }

    .calendar-day-header {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-muted);
    }

    .calendar-day {
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--card-bg-subtle);
      border-radius: 8px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .calendar-day.active-workout {
      background-color: var(--accent-color);
      color: #fff;
      font-weight: 800;
    }

    .calendar-day.today {
      border: 1px solid var(--accent-color);
    }

    /* Nav Bar */
    .nav-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 60px;
      background-color: var(--card-bg);
      border-top: 1px solid var(--border-color);
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 100;
    }

    .nav-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      width: 50%;
      height: 100%;
    }

    .nav-btn.active {
      color: var(--accent-color);
    }
  </style>
</head>
<body>

  <header>
    <h1>Jacked<span>.</span></h1>
    <select class="theme-select" id="themeSelect" onchange="setTheme(this.value)">
      <option value="default">Dark Purple</option>
      <option value="midnight">Midnight</option>
      <option value="emerald">Emerald</option>
    </select>
  </header>

  <main class="container">
    
    <!-- WORKOUT TAB -->
    <section id="workout-tab" class="tab-content active">
      
      <!-- Rest Timer -->
      <div class="timer-bar">
        <span style="font-size: 0.9rem; color: var(--text-muted);">Rest Timer: <strong id="timerDisplay" style="color: var(--text-main);">00:00</strong></span>
        <div>
          <button class="btn" style="padding: 4px 10px; font-size: 0.8rem;" onclick="startTimer(90)">+90s</button>
          <button class="btn-danger" style="padding: 4px 10px;" onclick="resetTimer()">Reset</button>
        </div>
      </div>

      <div class="card">
        <div class="card-title">Add Exercise</div>
        <div class="input-group">
          <input type="text" id="exercise-name-input" placeholder="e.g. Bench Press" />
          <button class="btn" onclick="addExercise()">Add</button>
        </div>
      </div>

      <div id="exercise-list"></div>

      <button class="btn" style="width: 100%; padding: 14px; margin-top: 8px;" onclick="finishWorkout()">
        Finish Workout
      </button>
    </section>

    <!-- UNIFIED PROGRESS TAB -->
    <section id="progress-tab" class="tab-content">
      
      <!-- Progress Chart Card -->
      <div class="card">
        <div class="card-title">Strength Progress</div>
        <select id="chart-exercise-select" class="theme-select" style="width: 100%; margin-bottom: 12px;" onchange="renderChart()">
          <option value="">No history logged yet</option>
        </select>
        <div class="chart-container">
          <canvas id="progressCanvas"></canvas>
        </div>
      </div>

      <!-- Calendar Card -->
      <div class="card">
        <div class="card-title" id="calendar-month-year">Calendar</div>
        <div class="calendar-grid" id="calendar-grid"></div>
      </div>

      <!-- History List -->
      <div class="card-title" style="margin-top: 20px;">Workout History</div>
      <div id="history-list"></div>

    </section>

  </main>

  <!-- Navigation Bar -->
  <nav class="nav-bar">
    <button class="nav-btn active" onclick="switchTab('workout-tab', this)">Workout</button>
    <button class="nav-btn" onclick="switchTab('progress-tab', this)">Progress</button>
  </nav>

  <script>
    let currentWorkout = [];
    let workoutHistory = JSON.parse(localStorage.getItem('jacked_history')) || [];
    let timerInterval = null;
    let timerSeconds = 0;

    document.addEventListener('DOMContentLoaded', () => {
      const savedTheme = localStorage.getItem('jacked_theme') || 'default';
      setTheme(savedTheme);
      document.getElementById('themeSelect').value = savedTheme;
      renderProgressTab();
    });

    function setTheme(theme) {
      if (theme === 'default') {
        document.documentElement.removeAttribute('data-theme');
      } else {
        document.documentElement.setAttribute('data-theme', theme);
      }
      localStorage.setItem('jacked_theme', theme);
    }

    function switchTab(tabId, btn) {
      document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));

      document.getElementById(tabId).classList.add('active');
      btn.classList.add('active');

      if (tabId === 'progress-tab') renderProgressTab();
    }

    /* Rest Timer Logic */
    function startTimer(seconds) {
      clearInterval(timerInterval);
      timerSeconds = seconds;
      updateTimerDisplay();

      timerInterval = setInterval(() => {
        timerSeconds--;
        updateTimerDisplay();
        if (timerSeconds <= 0) {
          clearInterval(timerInterval);
        }
      }, 1000);
    }

    function resetTimer() {
      clearInterval(timerInterval);
      timerSeconds = 0;
      updateTimerDisplay();
    }

    function updateTimerDisplay() {
      const mins = Math.floor(timerSeconds / 60);
      const secs = timerSeconds % 60;
      document.getElementById('timerDisplay').innerText = 
        `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
    }

    /* Workout Logging */
    function addExercise() {
      const input = document.getElementById('exercise-name-input');
      const name = input.value.trim();
      if (!name) return;

      currentWorkout.push({
        id: Date.now(),
        name: name,
        sets: [{ weight: '', reps: '' }]
      });

      input.value = '';
      renderWorkout();
    }

    function addSet(exId) {
      const ex = currentWorkout.find(e => e.id === exId);
      if (ex) {
        ex.sets.push({ weight: '', reps: '' });
        renderWorkout();
      }
    }

    function removeSet(exId, index) {
      const ex = currentWorkout.find(e => e.id === exId);
      if (ex) {
        ex.sets.splice(index, 1);
        renderWorkout();
      }
    }

    function removeExercise(exId) {
      currentWorkout = currentWorkout.filter(e => e.id !== exId);
      renderWorkout();
    }

    function updateSet(exId, index, field, value) {
      const ex = currentWorkout.find(e => e.id === exId);
      if (ex && ex.sets[index]) ex.sets[index][field] = value;
    }

    function renderWorkout() {
      const list = document.getElementById('exercise-list');
      if (currentWorkout.length === 0) {
        list.innerHTML = '<div style="text-align: center; color: var(--text-muted); padding: 20px 0;">No exercises added yet.</div>';
        return;
      }

      list.innerHTML = currentWorkout.map(ex => `
        <div class="card">
          <div class="card-title">
            <span>${ex.name}</span>
            <button class="btn-danger" onclick="removeExercise(${ex.id})">Delete</button>
          </div>
          ${ex.sets.map((s, i) => `
            <div class="set-row">
              <span class="set-num">${i + 1}</span>
              <input type="number" step="0.5" placeholder="kg/lbs" value="${s.weight}" onchange="updateSet(${ex.id}, ${i}, 'weight', this.value)" />
              <input type="number" placeholder="reps" value="${s.reps}" onchange="updateSet(${ex.id}, ${i}, 'reps', this.value)" />
              <button class="btn-danger" style="padding: 4px;" onclick="removeSet(${ex.id}, ${i})">✕</button>
            </div>
          `).join('')}
          <button class="btn" style="width: 100%; margin-top: 8px; background-color: var(--card-bg-subtle);" onclick="addSet(${ex.id})">+ Add Set</button>
        </div>
      `).join('');
    }

    function finishWorkout() {
      if (currentWorkout.length === 0) return alert("Add an exercise first!");

      workoutHistory.unshift({
        id: Date.now(),
        date: new Date().toISOString(),
        exercises: currentWorkout
      });

      localStorage.setItem('jacked_history', JSON.stringify(workoutHistory));
      currentWorkout = [];
      renderWorkout();
      alert("Workout saved!");
    }

    function deleteWorkoutSession(id) {
      if (confirm("Delete this log?")) {
        workoutHistory = workoutHistory.filter(s => s.id !== id);
        localStorage.setItem('jacked_history', JSON.stringify(workoutHistory));
        renderProgressTab();
      }
    }

    /* Progress & Charts */
    function renderProgressTab() {
      populateExercises();
      renderChart();
      renderCalendar();
      renderHistory();
    }

    function populateExercises() {
      const select = document.getElementById('chart-exercise-select');
      const uniqueEx = new Set();
      workoutHistory.forEach(s => s.exercises.forEach(e => { if (e.name) uniqueEx.add(e.name); }));

      if (uniqueEx.size === 0) {
        select.innerHTML = '<option value="">No history logged yet</option>';
        return;
      }

      const curr = select.value;
      select.innerHTML = Array.from(uniqueEx).map(e => `<option value="${e}">${e}</option>`).join('');
      if (curr && uniqueEx.has(curr)) select.value = curr;
    }

    function renderChart() {
      const canvas = document.getElementById('progressCanvas');
      const ctx = canvas.getContext('2d');
      const selected = document.getElementById('chart-exercise-select').value;

      const rect = canvas.getBoundingClientRect();
      canvas.width = rect.width * window.devicePixelRatio;
      canvas.height = rect.height * window.devicePixelRatio;
      ctx.scale(window.devicePixelRatio, window.devicePixelRatio);

      const w = rect.width, h = rect.height;
      ctx.clearRect(0, 0, w, h);

      if (!selected) return;

      const dataPoints = [];
      workoutHistory.slice().reverse().forEach(s => {
        const ex = s.exercises.find(e => e.name === selected);
        if (ex) {
          let max1RM = 0;
          ex.sets.forEach(set => {
            const weight = parseFloat(set.weight) || 0;
            const reps = parseFloat(set.reps) || 0;
            if (weight > 0 && reps > 0) {
              const e1rm = weight * (1 + reps / 30);
              if (e1rm > max1RM) max1RM = e1rm;
            }
          });
          if (max1RM > 0) {
            dataPoints.push({
              date: new Date(s.date).toLocaleDateString('en-US', { month: 'numeric', day: 'numeric' }),
              val: Math.round(max1RM)
            });
          }
        }
      });

      if (dataPoints.length < 2) {
        ctx.fillStyle = "#a0a0a0";
        ctx.font = "12px -apple-system, sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(`Log ${selected} again to generate trend line`, w / 2, h / 2);
        return;
      }

      const padL = 35, padR = 20, padT = 20, padB = 25;
      const chartW = w - padL - padR, chartH = h - padT - padB;
      const minV = Math.min(...dataPoints.map(d => d.val)) * 0.9;
      const maxV = Math.max(...dataPoints.map(d => d.val)) * 1.1;

      const getX = i => padL + (i / (dataPoints.length - 1)) * chartW;
      const getY = v => padT + chartH - ((v - minV) / (maxV - minV)) * chartH;

      ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--border-color');
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(padL, height - padB); ctx.lineTo(w - padR, height - padB);
      ctx.stroke();

      const accent = getComputedStyle(document.documentElement).getPropertyValue('--accent-color').trim();
      ctx.strokeStyle = accent || "#bb86fc";
      ctx.lineWidth = 3;
      ctx.beginPath();
      dataPoints.forEach((pt, i) => {
        const x = getX(i), y = getY(pt.val);
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      });
      ctx.stroke();

      dataPoints.forEach((pt, i) => {
        const x = getX(i), y = getY(pt.val);
        ctx.fillStyle = accent || "#bb86fc";
        ctx.beginPath();
        ctx.arc(x, y, 4, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "#a0a0a0";
        ctx.font = "10px -apple-system, sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(pt.date, x, h - 8);
        ctx.fillText(`${pt.val}`, x, y - 8);
      });
    }

    function renderCalendar() {
      const grid = document.getElementById('calendar-grid');
      const now = new Date();
      const year = now.getFullYear(), month = now.getMonth();

      document.getElementById('calendar-month-year').innerText = 
        now.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });

      const firstDay = new Date(year, month, 1).getDay();
      const totalDays = new Date(year, month + 1, 0).getDate();
      const workoutDates = new Set(workoutHistory.map(s => new Date(s.date).toDateString()));

      let html = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat']
        .map(d => `<div class="calendar-day-header">${d}</div>`).join('');

      for (let i = 0; i < firstDay; i++) html += `<div></div>`;

      for (let day = 1; day <= totalDays; day++) {
        const checkDate = new Date(year, month, day).toDateString();
        const isToday = checkDate === now.toDateString();
        const hasWorkout = workoutDates.has(checkDate);

        let cls = ['calendar-day'];
        if (hasWorkout) cls.push('active-workout');
        if (isToday) cls.push('today');

        html += `<div class="${cls.join(' ')}">${day}</div>`;
      }

      grid.innerHTML = html;
    }

    function renderHistory() {
      const list = document.getElementById('history-list');
      if (workoutHistory.length === 0) {
        list.innerHTML = '<div class="card" style="text-align: center; color: var(--text-muted);">No logs available.</div>';
        return;
      }

      list.innerHTML = workoutHistory.map(s => `
        <div class="card">
          <div class="card-title">
            <span>${new Date(s.date).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' })}</span>
            <button class="btn-danger" onclick="deleteWorkoutSession(${s.id})">Delete</button>
          </div>
          ${s.exercises.map(e => `
            <div style="margin-bottom: 8px;">
              <strong style="color: var(--accent-color); font-size: 0.95rem;">${e.name}</strong>
              <div style="color: var(--text-muted); font-size: 0.85rem;">
                ${e.sets.map((set, i) => `Set ${i+1}: ${set.weight || 0}kg × ${set.reps || 0}`).join(' | ')}
              </div>
            </div>
          `).join('')}
        </div>
      `).join('');
    }
  </script>
</body>
</html>
