<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gym Tracker</title>
  <style>
    :root {
      --bg: #121212;
      --card-bg: #1e1e1e;
      --accent: #ff4757;
      --accent-hover: #ff6b81;
      --text: #ffffff;
      --subtext: #a0a0a0;
      --input-bg: #2a2a2a;
      --border: #333333;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      padding: 16px;
      padding-bottom: 100px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    h1 {
      font-size: 1.4rem;
    }

    /* Date Picker Controls */
    .date-container {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--card-bg);
      padding: 8px 12px;
      border-radius: 10px;
      margin-bottom: 16px;
    }

    .date-container input[type="date"] {
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 1rem;
      font-family: inherit;
      width: 100%;
    }

    /* Timer Widget */
    .timer-card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 12px 16px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid var(--border);
    }

    .timer-display {
      font-size: 1.5rem;
      font-weight: bold;
      font-family: monospace;
      color: var(--accent);
    }

    .timer-btn {
      background: var(--input-bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
    }

    /* Exercise Cards */
    .exercise-card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
      border: 1px solid var(--border);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .exercise-name-input {
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--subtext);
      color: var(--text);
      font-size: 1.1rem;
      font-weight: bold;
      width: 80%;
      padding: 4px 0;
    }

    .exercise-name-input:focus {
      outline: none;
      border-bottom-color: var(--accent);
    }

    .btn-delete {
      background: transparent;
      border: none;
      color: var(--subtext);
      font-size: 1.2rem;
      cursor: pointer;
      padding: 4px 8px;
    }

    .btn-delete:hover {
      color: var(--accent);
    }

    .card-body {
      display: flex;
      gap: 12px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .input-group label {
      font-size: 0.7rem;
      color: var(--subtext);
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    input[type="number"] {
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: 10px;
      font-size: 1rem;
    }

    input[type="number"]:focus {
      outline: none;
      border-color: var(--accent);
    }

    .btn-add {
      width: 100%;
      background: var(--accent);
      color: white;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      margin-top: 12px;
    }

    .btn-add:active {
      opacity: 0.8;
    }
  </style>
</head>
<body>

  <header>
    <h1>Gym Tracker</h1>
  </header>

  <!-- Date Selection -->
  <div class="date-container">
    <input type="date" id="workout-date" onchange="loadWorkoutForSelectedDate()">
  </div>

  <!-- Rest Timer Bar -->
  <div class="timer-card">
    <div>
      <div style="font-size: 0.75rem; color: var(--subtext);">REST TIMER</div>
      <div class="timer-display" id="timer-display">00:00</div>
    </div>
    <div style="display: flex; gap: 6px;">
      <button class="timer-btn" onclick="startTimer(90)">90s</button>
      <button class="timer-btn" onclick="startTimer(120)">2m</button>
      <button class="timer-btn" onclick="resetTimer()">Reset</button>
    </div>
  </div>

  <!-- Main Exercises List -->
  <div id="exercise-container"></div>

  <button class="btn-add" onclick="addExercise()">+ Add Exercise</button>

  <script>
    const container = document.getElementById('exercise-container');
    const dateInput = document.getElementById('workout-date');
    let timerInterval = null;

    // Set default date to Today
    dateInput.valueAsDate = new Date();

    function getStorageKey() {
      return `gymTracker_workout_${dateInput.value}`;
    }

    // Timer Logic
    function startTimer(seconds) {
      clearInterval(timerInterval);
      let remaining = seconds;
      updateTimerDisplay(remaining);

      timerInterval = setInterval(() => {
        remaining--;
        updateTimerDisplay(remaining);
        if (remaining <= 0) {
          clearInterval(timerInterval);
          if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
        }
      }, 1000);
    }

    function resetTimer() {
      clearInterval(timerInterval);
      updateTimerDisplay(0);
    }

    function updateTimerDisplay(totalSeconds) {
      const mins = Math.floor(totalSeconds / 60).toString().padStart(2, '0');
      const secs = (totalSeconds % 60).toString().padStart(2, '0');
      document.getElementById('timer-display').textContent = `${mins}:${secs}`;
    }

    // Card Builder
    function createCardElement(data = { name: '', weight: '', reps: '' }) {
      const card = document.createElement('div');
      card.className = 'exercise-card';

      card.innerHTML = `
        <div class="card-header">
          <input type="text" class="exercise-name-input" value="${data.name || ''}" placeholder="Exercise Name" oninput="saveCurrentWorkoutState()">
          <button class="btn-delete" onclick="deleteExercise(this)">✕</button>
        </div>
        <div class="card-body">
          <div class="input-group">
            <label>Weight (kg/lbs)</label>
            <input type="number" step="any" class="weight-input" value="${data.weight || ''}" placeholder="0" oninput="saveCurrentWorkoutState()">
          </div>
          <div class="input-group">
            <label>Reps</label>
            <input type="number" step="any" class="reps-input" value="${data.reps || ''}" placeholder="0" oninput="saveCurrentWorkoutState()">
          </div>
        </div>
      `;

      return card;
    }

    function addExercise() {
      const newCard = createCardElement();
      container.appendChild(newCard);
      saveCurrentWorkoutState();
    }

    // Direct Deletion Fix (Leaves other inputs untouched)
    function deleteExercise(buttonElement) {
      const card = buttonElement.closest('.exercise-card');
      if (card) {
        card.remove();
        saveCurrentWorkoutState();
      }
    }

    // State Persistence
    function saveCurrentWorkoutState() {
      const exercises = [];
      document.querySelectorAll('.exercise-card').forEach(card => {
        const name = card.querySelector('.exercise-name-input')?.value || '';
        const weight = card.querySelector('.weight-input')?.value || '';
        const reps = card.querySelector('.reps-input')?.value || '';
        exercises.push({ name, weight, reps });
      });

      localStorage.setItem(getStorageKey(), JSON.stringify(exercises));
    }

    function loadWorkoutForSelectedDate() {
      container.innerHTML = '';
      const saved = localStorage.getItem(getStorageKey());
      if (saved) {
        const exercises = JSON.parse(saved);
        exercises.forEach(ex => container.appendChild(createCardElement(ex)));
      } else {
        addExercise();
      }
    }

    // Initialize App
    loadWorkoutForSelectedDate();
  </script>
</body>
</html>
