<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gym Tracker</title>
  <style>
    :root {
      --bg: #121212;
      --card-bg: #1e1e1e;
      --accent: #ff4757;
      --text: #ffffff;
      --subtext: #a0a0a0;
      --input-bg: #2a2a2a;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 16px;
      padding-bottom: 80px;
    }

    h1 {
      font-size: 1.5rem;
      margin-bottom: 16px;
    }

    .exercise-card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .exercise-name-input {
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--subtext);
      color: var(--text);
      font-size: 1.1rem;
      font-weight: bold;
      width: 80%;
      padding: 4px 0;
    }

    .exercise-name-input:focus {
      outline: none;
      border-bottom-color: var(--accent);
    }

    .btn-delete {
      background: transparent;
      border: none;
      color: var(--subtext);
      font-size: 1.2rem;
      cursor: pointer;
      padding: 4px 8px;
    }

    .btn-delete:hover {
      color: var(--accent);
    }

    .card-body {
      display: flex;
      gap: 12px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .input-group label {
      font-size: 0.75rem;
      color: var(--subtext);
      margin-bottom: 4px;
    }

    input[type="number"] {
      background: var(--input-bg);
      border: 1px solid transparent;
      border-radius: 8px;
      color: var(--text);
      padding: 10px;
      font-size: 1rem;
    }

    input[type="number"]:focus {
      outline: none;
      border-color: var(--accent);
    }

    .btn-add {
      width: 100%;
      background: var(--accent);
      color: white;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      margin-top: 12px;
    }

    .btn-add:active {
      opacity: 0.8;
    }
  </style>
</head>
<body>

  <h1>Workout Tracker</h1>

  <div id="exercise-container">
    <!-- Exercise cards will render here -->
  </div>

  <button class="btn-add" onclick="addExercise()">+ Add Exercise</button>

  <script>
    const container = document.getElementById('exercise-container');

    // Create and append a new exercise card
    function createCardElement(data = { name: '', weight: '', reps: '' }) {
      const card = document.createElement('div');
      card.className = 'exercise-card';

      card.innerHTML = `
        <div class="card-header">
          <input type="text" class="exercise-name-input" value="${data.name}" placeholder="Exercise Name" oninput="saveCurrentWorkoutState()">
          <button class="btn-delete" onclick="deleteExercise(this)">✕</button>
        </div>
        <div class="card-body">
          <div class="input-group">
            <label>WEIGHT</label>
            <!-- step="any" allows decimals like 11.8, 12.5, etc. -->
            <input type="number" step="any" class="weight-input" value="${data.weight}" placeholder="0" oninput="saveCurrentWorkoutState()">
          </div>
          <div class="input-group">
            <label>REPS</label>
            <!-- step="any" also added here in case of fractional reps/half reps -->
            <input type="number" step="any" class="reps-input" value="${data.reps}" placeholder="0" oninput="saveCurrentWorkoutState()">
          </div>
        </div>
      `;

      return card;
    }

    // Add a new empty exercise without disturbing existing inputs
    function addExercise() {
      const newCard = createCardElement();
      container.appendChild(newCard);
      saveCurrentWorkoutState();
    }

    // Direct DOM Deletion: Removes ONLY the clicked card and keeps all other active inputs intact
    function deleteExercise(buttonElement) {
      const card = buttonElement.closest('.exercise-card');
      if (card) {
        card.remove(); // Removes node directly from DOM
        saveCurrentWorkoutState(); // Syncs state to localStorage
      }
    }

    // Scrapes current input values directly from screen and saves to localStorage
    function saveCurrentWorkoutState() {
      const exercises = [];
      document.querySelectorAll('.exercise-card').forEach(card => {
        const name = card.querySelector('.exercise-name-input')?.value || '';
        const weight = card.querySelector('.weight-input')?.value || '';
        const reps = card.querySelector('.reps-input')?.value || '';
        exercises.push({ name, weight, reps });
      });

      localStorage.setItem('gymTracker_currentWorkout', JSON.stringify(exercises));
    }

    // Load initial data on page load
    function loadSavedWorkout() {
      const saved = localStorage.getItem('gymTracker_currentWorkout');
      if (saved) {
        const exercises = JSON.parse(saved);
        exercises.forEach(ex => container.appendChild(createCardElement(ex)));
      } else {
        // Default card if empty
        addExercise();
      }
    }

    // Initialize
    loadSavedWorkout();
  </script>
</body>
</html>
