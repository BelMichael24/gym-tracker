<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Jacked.</title>
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --card-bg-subtle: #2a2a2a;
      --accent-color: #bb86fc;
      --accent-hover: #9965f4;
      --text-main: #ffffff;
      --text-muted: #a0a0a0;
      --border-color: #333333;
      --danger-color: #cf6679;
      --success-color: #03dac6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      padding-bottom: 70px;
    }

    header {
      padding: 20px 16px;
      background-color: var(--card-bg);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: var(--text-main);
    }

    h1 span {
      color: var(--accent-color);
    }

    .container {
      padding: 16px;
      max-width: 600px;
      margin: 0 auto;
      width: 100%;
    }

    /* Tabs Navigation */
    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    .nav-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 60px;
      background-color: var(--card-bg);
      border-top: 1px solid var(--border-color);
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 100;
    }

    .nav-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 0.85rem;
      font-weight: 600;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      width: 50%;
      padding: 8px 0;
    }

    .nav-btn.active {
      color: var(--accent-color);
    }

    /* Common Card Styling */
    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .card-title {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Input & Button Styles */
    input, select, button {
      outline: none;
      font-size: 1rem;
    }

    .input-group {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    input[type="text"], input[type="number"], select {
      background-color: var(--card-bg-subtle);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 10px 12px;
      border-radius: 8px;
      width: 100%;
    }

    input:focus, select:focus {
      border-color: var(--accent-color);
    }

    .btn {
      background-color: var(--accent-color);
      color: #000;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn:active {
      background-color: var(--accent-hover);
    }

    .btn-danger {
      background-color: transparent;
      color: var(--danger-color);
      border: 1px solid var(--danger-color);
      padding: 6px 12px;
      font-size: 0.85rem;
      border-radius: 6px;
    }

    /* Workout Tab Styles */
    .exercise-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .set-row {
      display: grid;
      grid-template-columns: 40px 1fr 1fr 40px;
      gap: 8px;
      align-items: center;
      margin-bottom: 8px;
    }

    .set-num {
      font-weight: 700;
      color: var(--text-muted);
      text-align: center;
    }

    /* Dynamic Chart Styles */
    .chart-container {
      position: relative;
      width: 100%;
      height: 220px;
      margin-top: 8px;
    }

    canvas {
      width: 100% !important;
      height: 100% !important;
    }

    /* Calendar Styles */
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
      text-align: center;
      margin-top: 12px;
    }

    .calendar-day-header {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-muted);
      padding-bottom: 4px;
    }

    .calendar-day {
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--card-bg-subtle);
      border-radius: 8px;
      font-size: 0.85rem;
      color: var(--text-muted);
      cursor: pointer;
    }

    .calendar-day.active-workout {
      background-color: var(--accent-color);
      color: #000;
      font-weight: 800;
    }

    .calendar-day.today {
      border: 1px solid var(--accent-color);
    }

    .empty-state {
      text-align: center;
      color: var(--text-muted);
      padding: 24px 0;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>

  <header>
    <h1>Jacked<span>.</span></h1>
    <span id="current-date" style="color: var(--text-muted); font-size: 0.85rem;"></span>
  </header>

  <main class="container">
    
    <!-- LOG WORKOUT TAB -->
    <section id="workout-tab" class="tab-content active">
      <div class="card">
        <div class="card-title">Add Exercise</div>
        <div class="input-group">
          <input type="text" id="exercise-name-input" placeholder="e.g. Bench Press, Squat..." />
          <button class="btn" onclick="addExercise()">Add</button>
        </div>
      </div>

      <div id="exercise-list"></div>

      <button class="btn" style="width: 100%; padding: 14px; font-size: 1rem; margin-top: 8px;" onclick="finishWorkout()">
        Finish & Save Workout
      </button>
    </section>

    <!-- UNIFIED PROGRESS TAB -->
    <section id="progress-tab" class="tab-content">
      
      <!-- Dynamic Chart Card -->
      <div class="card">
        <div class="card-title">
          <span>Strength Progress</span>
        </div>
        <div style="margin-bottom: 12px;">
          <select id="chart-exercise-select" onchange="renderChart()">
            <option value="">No workout history available</option>
          </select>
        </div>
        <div class="chart-container">
          <canvas id="progressCanvas"></canvas>
        </div>
      </div>

      <!-- Calendar Card -->
      <div class="card">
        <div class="card-title" id="calendar-month-year">Workout Calendar</div>
        <div class="calendar-grid" id="calendar-grid"></div>
      </div>

      <!-- History Log List -->
      <div class="card-title" style="margin: 20px 0 12px 4px;">Workout Logs</div>
      <div id="history-list"></div>

    </section>

  </main>

  <!-- Bottom Navigation -->
  <nav class="nav-bar">
    <button class="nav-btn active" onclick="switchTab('workout-tab', this)">
      <span> Workout</span>
    </button>
    <button class="nav-btn" onclick="switchTab('progress-tab', this)">
      <span> Progress</span>
    </button>
  </nav>

  <script>
    // --- APP STATE ---
    let currentWorkout = [];
    let workoutHistory = JSON.parse(localStorage.getItem('jacked_history')) || [];

    // --- INITIALIZATION ---
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('current-date').innerText = new Date().toLocaleDateString('en-US', {
        weekday: 'short', month: 'short', day: 'numeric'
      });
      renderProgressTab();
    });

    // --- TAB SWITCHING ---
    function switchTab(tabId, btnElement) {
      document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));

      document.getElementById(tabId).classList.add('active');
      btnElement.classList.add('active');

      if (tabId === 'progress-tab') {
        renderProgressTab();
      }
    }

    // --- WORKOUT LOGGING LOGIC ---
    function addExercise() {
      const input = document.getElementById('exercise-name-input');
      const name = input.value.trim();
      if (!name) return;

      currentWorkout.push({
        id: Date.now(),
        name: name,
        sets: [{ weight: '', reps: '' }]
      });

      input.value = '';
      renderCurrentWorkout();
    }

    function addSet(exerciseId) {
      const ex = currentWorkout.find(e => e.id === exerciseId);
      if (ex) {
        ex.sets.push({ weight: '', reps: '' });
        renderCurrentWorkout();
      }
    }

    function removeExercise(exerciseId) {
      currentWorkout = currentWorkout.filter(e => e.id !== exerciseId);
      renderCurrentWorkout();
    }

    function updateSet(exerciseId, setIndex, field, value) {
      const ex = currentWorkout.find(e => e.id === exerciseId);
      if (ex && ex.sets[setIndex]) {
        ex.sets[setIndex][field] = value;
      }
    }

    function renderCurrentWorkout() {
      const list = document.getElementById('exercise-list');
      if (currentWorkout.length === 0) {
        list.innerHTML = '<div class="empty-state">No exercises added yet.</div>';
        return;
      }

      list.innerHTML = currentWorkout.map(ex => `
        <div class="exercise-card">
          <div class="card-title">
            <span>${ex.name}</span>
            <button class="btn-danger" onclick="removeExercise(${ex.id})">Remove</button>
          </div>
          ${ex.sets.map((set, i) => `
            <div class="set-row">
              <span class="set-num">${i + 1}</span>
              <input type="number" step="0.5" placeholder="kg/lbs" value="${set.weight}" onchange="updateSet(${ex.id}, ${i}, 'weight', this.value)" />
              <input type="number" placeholder="reps" value="${set.reps}" onchange="updateSet(${ex.id}, ${i}, 'reps', this.value)" />
            </div>
          `).join('')}
          <button class="btn" style="width: 100%; margin-top: 8px; background-color: var(--card-bg-subtle); color: var(--text-main);" onclick="addSet(${ex.id})">
            + Add Set
          </button>
        </div>
      `).join('');
    }

    function finishWorkout() {
      if (currentWorkout.length === 0) {
        alert("Please add at least one exercise before saving!");
        return;
      }

      const session = {
        id: Date.now(),
        date: new Date().toISOString(),
        exercises: currentWorkout
      };

      workoutHistory.unshift(session);
      localStorage.setItem('jacked_history', JSON.stringify(workoutHistory));
      
      currentWorkout = [];
      renderCurrentWorkout();
      alert("Workout saved successfully!");
    }

    function deleteWorkoutSession(sessionId) {
      if (confirm("Are you sure you want to delete this workout log?")) {
        workoutHistory = workoutHistory.filter(s => s.id !== sessionId);
        localStorage.setItem('jacked_history', JSON.stringify(workoutHistory));
        renderProgressTab();
      }
    }

    // --- UNIFIED PROGRESS TAB LOGIC ---
    function renderProgressTab() {
      populateExerciseDropdown();
      renderChart();
      renderCalendar();
      renderHistoryList();
    }

    // Extract unique exercise names dynamically
    function populateExerciseDropdown() {
      const select = document.getElementById('chart-exercise-select');
      const uniqueExercises = new Set();

      workoutHistory.forEach(session => {
        session.exercises.forEach(ex => {
          if (ex.name) uniqueExercises.add(ex.name);
        });
      });

      if (uniqueExercises.size === 0) {
        select.innerHTML = '<option value="">No workout history available</option>';
        return;
      }

      const currentSelection = select.value;
      select.innerHTML = Array.from(uniqueExercises)
        .map(name => `<option value="${name}">${name}</option>`)
        .join('');

      if (currentSelection && uniqueExercises.has(currentSelection)) {
        select.value = currentSelection;
      }
    }

    // HTML Canvas Progress Chart
    function renderChart() {
      const canvas = document.getElementById('progressCanvas');
      const ctx = canvas.getContext('2d');
      const selectedExercise = document.getElementById('chart-exercise-select').value;

      // Set high-DPI resolution
      const rect = canvas.getBoundingClientRect();
      canvas.width = rect.width * window.devicePixelRatio;
      canvas.height = rect.height * window.devicePixelRatio;
      ctx.scale(window.devicePixelRatio, window.devicePixelRatio);

      const width = rect.width;
      const height = rect.height;

      ctx.clearRect(0, 0, width, height);

      if (!selectedExercise) {
        ctx.fillStyle = "#a0a0a0";
        ctx.font = "14px -apple-system, sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("Log workouts to unlock progress charts", width / 2, height / 2);
        return;
      }

      // Collect data points (Date vs Estimated 1RM)
      const dataPoints = [];
      workoutHistory.slice().reverse().forEach(session => {
        const ex = session.exercises.find(e => e.name === selectedExercise);
        if (ex) {
          let max1RM = 0;
          ex.sets.forEach(set => {
            const w = parseFloat(set.weight) || 0;
            const r = parseFloat(set.reps) || 0;
            if (w > 0 && r > 0) {
              const e1rm = w * (1 + r / 30); // Epley Formula
              if (e1rm > max1RM) max1RM = e1rm;
            }
          });
          if (max1RM > 0) {
            dataPoints.push({
              date: new Date(session.date).toLocaleDateString('en-US', { month: 'numeric', day: 'numeric' }),
              val: Math.round(max1RM)
            });
          }
        }
      });

      if (dataPoints.length < 2) {
        ctx.fillStyle = "#a0a0a0";
        ctx.font = "14px -apple-system, sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(`Log ${selectedExercise} again to view your trend`, width / 2, height / 2);
        return;
      }

      // Chart Padding & Math
      const padL = 40, padR = 20, padT = 20, padB = 30;
      const chartW = width - padL - padR;
      const chartH = height - padT - padB;

      const minVal = Math.min(...dataPoints.map(d => d.val)) * 0.9;
      const maxVal = Math.max(...dataPoints.map(d => d.val)) * 1.1;

      const getX = i => padL + (i / (dataPoints.length - 1)) * chartW;
      const getY = val => padT + chartH - ((val - minVal) / (maxVal - minVal)) * chartH;

      // Draw Grid Lines
      ctx.strokeStyle = "#333333";
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(padL, padT); ctx.lineTo(padL, height - padB);
      ctx.moveTo(padL, height - padB); ctx.lineTo(width - padR, height - padB);
      ctx.stroke();

      // Draw Trend Line
      ctx.strokeStyle = "#bb86fc";
      ctx.lineWidth = 3;
      ctx.beginPath();
      dataPoints.forEach((pt, i) => {
        const x = getX(i);
        const y = getY(pt.val);
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.stroke();

      // Draw Dots and Labels
      dataPoints.forEach((pt, i) => {
        const x = getX(i);
        const y = getY(pt.val);

        ctx.fillStyle = "#bb86fc";
        ctx.beginPath();
        ctx.arc(x, y, 5, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "#a0a0a0";
        ctx.font = "10px -apple-system, sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(pt.date, x, height - 10);
        ctx.fillText(`${pt.val}`, x, y - 10);
      });
    }

    // Render Calendar View
    function renderCalendar() {
      const grid = document.getElementById('calendar-grid');
      const now = new Date();
      const year = now.getFullYear();
      const month = now.getMonth();

      document.getElementById('calendar-month-year').innerText = 
        now.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });

      const firstDayIndex = new Date(year, month, 1).getDay();
      const totalDays = new Date(year, month + 1, 0).getDate();

      const workoutDates = new Set(
        workoutHistory.map(s => new Date(s.date).toDateString())
      );

      let html = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat']
        .map(d => `<div class="calendar-day-header">${d}</div>`).join('');

      for (let i = 0; i < firstDayIndex; i++) {
        html += `<div></div>`;
      }

      for (let day = 1; day <= totalDays; day++) {
        const checkDate = new Date(year, month, day).toDateString();
        const isToday = checkDate === now.toDateString();
        const hasWorkout = workoutDates.has(checkDate);

        let classes = ['calendar-day'];
        if (hasWorkout) classes.push('active-workout');
        if (isToday) classes.push('today');

        html += `<div class="${classes.join(' ')}">${day}</div>`;
      }

      grid.innerHTML = html;
    }

    // Render History Logs
    function renderHistoryList() {
      const list = document.getElementById('history-list');

      if (workoutHistory.length === 0) {
        list.innerHTML = '<div class="card empty-state">No past workouts logged yet.</div>';
        return;
      }

      list.innerHTML = workoutHistory.map(session => {
        const dateStr = new Date(session.date).toLocaleDateString('en-US', {
          weekday: 'short', month: 'short', day: 'numeric', year: 'numeric'
        });

        return `
          <div class="card">
            <div class="card-title">
              <span>${dateStr}</span>
              <button class="btn-danger" onclick="deleteWorkoutSession(${session.id})">Delete</button>
            </div>
            ${session.exercises.map(ex => `
              <div style="margin-bottom: 8px;">
                <strong style="color: var(--accent-color); font-size: 0.95rem;">${ex.name}</strong>
                <div style="color: var(--text-muted); font-size: 0.85rem; margin-top: 2px;">
                  ${ex.sets.map((s, i) => `Set ${i+1}: ${s.weight || 0}kg × ${s.reps || 0}`).join(' | ')}
                </div>
              </div>
            `).join('')}
          </div>
        `;
      }).join('');
    }
  </script>
</body>
</html>
