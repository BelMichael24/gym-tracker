<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#121212">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Jacked.</title>

  <!-- PWA Manifest for Android / Chrome -->
  <link rel="manifest" href='data:application/manifest+json,{
    "name": "Jacked.",
    "short_name": "Jacked",
    "start_url": "./",
    "display": "standalone",
    "background_color": "#121212",
    "theme_color": "#121212"
  }'>

  <style>
    /* Revamped Creative Theme Definitions */
    :root, [data-theme="amber"] {
      --bg: #120e0b;
      --card: #1f1812;
      --card-border: #3d2d1f;
      --accent: #ffb703;
      --accent-hover: #fb8500;
      --text: #fffaf2;
      --text-dim: #b89c85;
      --danger: #ff4d4d;
      --success: #ffb703;
    }

    [data-theme="amoled"] {
      --bg: #000000;
      --card: #0a0e14;
      --card-border: #142233;
      --accent: #00f0ff;
      --accent-hover: #00b8ff;
      --text: #ffffff;
      --text-dim: #5c80a6;
      --danger: #ff3366;
      --success: #00f0ff;
    }

    [data-theme="crimson"] {
      --bg: #120708;
      --card: #210d10;
      --card-border: #42181d;
      --accent: #ff2a55;
      --accent-hover: #d61339;
      --text: #fff0f2;
      --text-dim: #ba7b85;
      --danger: #ff003b;
      --success: #20e070;
    }

    [data-theme="dracula"] {
      --bg: #181623;
      --card: #221f33;
      --card-border: #3b3557;
      --accent: #ff79c6;
      --accent-hover: #bd93f9;
      --text: #f8f8f2;
      --text-dim: #8b88b3;
      --danger: #ff5555;
      --success: #50fa7b;
    }

    [data-theme="forest"] {
      --bg: #0b140f;
      --card: #122119;
      --card-border: #1f3d2d;
      --accent: #2ec4b6;
      --accent-hover: #20998e;
      --text: #f0fdf4;
      --text-dim: #6d9c82;
      --danger: #ff6b6b;
      --success: #2ec4b6;
    }

    [data-theme="frost"] {
      --bg: #08121a;
      --card: #10202e;
      --card-border: #1a354d;
      --accent: #00e5ff;
      --accent-hover: #00a8ff;
      --text: #f0f8ff;
      --text-dim: #628ea8;
      --danger: #ff5252;
      --success: #00e5ff;
    }

    [data-theme="matrix"] {
      --bg: #030a05;
      --card: #08170c;
      --card-border: #103318;
      --accent: #00ff66;
      --accent-hover: #00cc52;
      --text: #f0fff4;
      --text-dim: #4d9961;
      --danger: #ff3333;
      --success: #00ff66;
    }

    [data-theme="orange"] {
      --bg: #170b04;
      --card: #261308;
      --card-border: #4d240d;
      --accent: #ff5500;
      --accent-hover: #cc4400;
      --text: #fff5f0;
      --text-dim: #ba7b59;
      --danger: #ff3333;
      --success: #ff5500;
    }

    [data-theme="purple"] {
      --bg: #11091c;
      --card: #1e1030;
      --card-border: #391c5c;
      --accent: #a855f7;
      --accent-hover: #9333ea;
      --text: #faf5ff;
      --text-dim: #9472ba;
      --danger: #ff4d6d;
      --success: #c084fc;
    }

    [data-theme="slate"] {
      --bg: #0f172a;
      --card: #1e293b;
      --card-border: #334155;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --text: #f8fafc;
      --text-dim: #64748b;
      --danger: #f87171;
      --success: #38bdf8;
    }

    [data-theme="sunset"] {
      --bg: #1a0f18;
      --card: #2a1626;
      --card-border: #4a2443;
      --accent: #f43f5e;
      --accent-hover: #e11d48;
      --text: #fff1f2;
      --text-dim: #b87498;
      --danger: #ff2056;
      --success: #fb7185;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 16px; -webkit-tap-highlight-color: transparent; transition: background-color 0.25s ease, color 0.25s ease; }

    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid var(--card-border); padding-bottom: 12px; }
    
    h1 { 
      font-size: 1.6rem; 
      color: var(--accent); 
      font-weight: 800; 
      letter-spacing: -0.5px; 
      cursor: pointer; 
      user-select: none;
      display: inline-block;
      transition: transform 0.1s ease, opacity 0.1s ease;
    }
    h1:active { 
      transform: scale(0.92); 
      opacity: 0.8; 
    }
    h1.refreshing {
      animation: spinPulse 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }

    @keyframes spinPulse {
      0% { transform: scale(1) rotate(0deg); opacity: 1; }
      50% { transform: scale(1.15) rotate(180deg); opacity: 0.7; }
      100% { transform: scale(1) rotate(360deg); opacity: 1; }
    }

    .icon-btn {
      background: var(--card);
      border: 1px solid var(--card-border);
      color: var(--accent);
      width: 38px;
      height: 38px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      cursor: pointer;
      transition: transform 0.1s ease, background 0.2s ease, border-color 0.2s ease;
    }
    .icon-btn:active {
      transform: scale(0.92);
    }

    .theme-select { 
      background: var(--bg); 
      color: var(--text); 
      border: 1px solid var(--card-border); 
      padding: 10px; 
      border-radius: 8px; 
      font-size: 0.9rem; 
      font-weight: 600; 
      outline: none; 
      cursor: pointer; 
      width: 100%;
    }

    .nav-tabs { display: flex; gap: 8px; margin-bottom: 16px; overflow-x: auto; }
    .tab-btn { flex: 1; background: var(--card); border: 1px solid var(--card-border); color: var(--text-dim); padding: 10px 4px; border-radius: 10px; font-weight: 600; font-size: 0.85rem; text-align: center; white-space: nowrap; cursor: pointer; transition: all 0.2s ease; }
    .tab-btn.active { background: var(--accent); color: #000; border-color: var(--accent); }

    .card { background: var(--card); border: 1px solid var(--card-border); border-radius: 14px; padding: 16px; margin-bottom: 16px; transition: background-color 0.25s ease, border-color 0.25s ease; }
    .card-title { font-size: 1.05rem; margin-bottom: 12px; color: var(--text); display: flex; justify-content: space-between; align-items: center; font-weight: 700; letter-spacing: -0.2px; }
    
    .date-picker-card { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .date-picker-card label { font-size: 0.9rem; color: var(--accent); font-weight: 600; }
    .date-picker-card input[type="date"] { background: var(--bg); border: 1px solid var(--card-border); color: #fff; padding: 8px 12px; border-radius: 8px; font-size: 0.9rem; text-align: center; width: auto; color-scheme: dark; }

    .set-row { display: grid; grid-template-columns: 1.6fr 1.5fr 1.5fr 30px; gap: 6px; align-items: center; margin-bottom: 8px; }
    input, select { background: var(--bg); border: 1px solid var(--card-border); color: #fff; padding: 8px; border-radius: 8px; font-size: 0.9rem; width: 100%; text-align: center; }
    input[type="text"] { text-align: left; }
    input:focus, select:focus { border-color: var(--accent); outline: none; }

    /* Stepper Input Wrappers */
    .stepper-input-group {
      display: flex;
      align-items: center;
      background: var(--bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      overflow: hidden;
    }
    .stepper-input-group:focus-within {
      border-color: var(--accent);
    }
    .stepper-input-group input {
      background: transparent;
      border: none;
      padding: 8px 2px;
      font-size: 0.85rem;
      width: 100%;
    }
    .step-btn {
      background: transparent;
      border: none;
      color: var(--text-dim);
      font-weight: bold;
      font-size: 0.85rem;
      padding: 0 6px;
      height: 100%;
      cursor: pointer;
      user-select: none;
      transition: color 0.1s ease;
    }
    .step-btn:hover {
      color: var(--accent);
    }
    .step-btn:active {
      background: rgba(255,255,255,0.05);
    }

    .btn { background: var(--accent); color: #000; border: none; padding: 12px; border-radius: 10px; font-weight: bold; width: 100%; font-size: 0.95rem; margin-top: 8px; cursor: pointer; transition: opacity 0.15s ease; }
    .btn:active { opacity: 0.85; }
    .btn-secondary { background: var(--card); color: var(--text-dim); border: 1px solid var(--card-border); margin-top: 4px; }
    .btn-del { background: transparent; color: var(--danger); font-size: 1.2rem; border: none; height: 36px; cursor: pointer; }
    .btn-action-log { background: transparent; color: var(--accent); border: 1px solid var(--accent); padding: 5px 12px; border-radius: 6px; font-size: 0.75rem; font-weight: 600; cursor: pointer; margin-left: 6px; }
    .btn-delete-log { color: var(--danger); border-color: var(--danger); }

    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.75);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }
    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }
    .modal-card {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 20px;
      width: 100%;
      max-width: 360px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    .cal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .cal-header button { background: var(--bg); border: 1px solid var(--card-border); color: var(--text); padding: 6px 14px; border-radius: 8px; font-weight: bold; cursor: pointer; }
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; text-align: center; }
    .cal-day-label { font-size: 0.75rem; color: var(--text-dim); font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; padding-bottom: 6px; }
    .cal-day { 
      background: var(--bg); 
      border-radius: 10px; 
      padding: 12px 0; 
      font-size: 0.85rem; 
      font-weight: 600; 
      cursor: pointer; 
      position: relative; 
      border: 1px solid transparent; 
      transition: all 0.15s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 44px;
    }
    .cal-day.empty { background: transparent; cursor: default; }
    .cal-day.has-workout { background: var(--card); border-color: var(--card-border); color: var(--text); font-weight: 700; }
    .cal-day.has-workout::after { content: ''; display: block; width: 4px; height: 4px; background: var(--accent); border-radius: 50%; margin-top: 3px; }
    .cal-day.selected { border-color: var(--accent) !important; background: rgba(255, 255, 255, 0.05); }

    .inspector-card {
      background: var(--card);
      border: 1px solid var(--accent);
      border-radius: 14px;
      padding: 16px;
      margin-top: 12px;
      animation: fadeIn 0.2s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .chart-container { width: 100%; height: 180px; margin-top: 10px; position: relative; }
    canvas { width: 100% !important; height: 100% !important; }

    .history-item { border-bottom: 1px solid var(--card-border); padding: 10px 0; }
    .history-item:last-child { border-bottom: none; }
    .history-date { font-size: 0.75rem; color: var(--text-dim); margin-top: 2px; }

    .settings-section-title {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }
  </style>
</head>
<body>

  <header>
    <h1 id="appLogo" onclick="refreshApp()" title="Tap to refresh app">Jacked.</h1>
    <button type="button" class="icon-btn" onclick="openSettingsModal()" aria-label="Settings">⚙</button>
  </header>

  <div class="nav-tabs">
    <button class="tab-btn active" id="tabWorkoutBtn" onclick="switchTab('workout', event)">Log Workout</button>
    <button class="tab-btn" id="tabProgressBtn" onclick="switchTab('progress', event)">Progress</button>
  </div>

  <div id="workoutContainer"></div>

  <!-- Settings Modal Popup -->
  <div id="settingsModal" class="modal-overlay">
    <div class="modal-card">
      <h3 style="color:var(--text); margin-bottom:16px; font-size:1.1rem; display:flex; justify-content:space-between; align-items:center;">
        <span>Settings</span>
        <button type="button" class="btn-del" style="height:auto; font-size:1.1rem;" onclick="closeSettingsModal()">✕</button>
      </h3>

      <div style="margin-bottom:20px;">
        <div class="settings-section-title">App Theme</div>
        <select class="theme-select" id="themeSelect" onchange="changeTheme(this.value)">
          <option value="amber">Cyberpunk Amber</option>
          <option value="amoled">Electric Cyber (AMOLED)</option>
          <option value="crimson">Vampire Red</option>
          <option value="dracula">Retro Synthwave</option>
          <option value="forest">Deep Moss Green</option>
          <option value="frost">Glacier Ice Blue</option>
          <option value="matrix">Toxic Hacker Lime</option>
          <option value="orange">Solar Flare Orange</option>
          <option value="purple">Midnight Amethyst</option>
          <option value="slate">Gunmetal Steel</option>
          <option value="sunset">Neon Dusk Coral</option>
        </select>
      </div>

      <div style="margin-bottom:16px;">
        <div class="settings-section-title">Data Backup & Restore</div>
        <p style="font-size:0.8rem; color:var(--text-dim); margin-bottom:10px;">Save your workout data to clipboard or restore data on a new device.</p>
        <div style="display:flex; gap:8px;">
          <button type="button" class="btn btn-secondary" style="margin:0; font-size:0.85rem;" onclick="exportData()">Backup Data</button>
          <button type="button" class="btn btn-secondary" style="margin:0; font-size:0.85rem;" onclick="importData()">Restore Data</button>
        </div>
      </div>

      <button type="button" class="btn" style="margin-top:20px;" onclick="closeSettingsModal()">Done</button>
    </div>
  </div>

  <!-- Modal Popup for Adding/Selecting Exercise -->
  <div id="addExerciseModal" class="modal-overlay">
    <div class="modal-card">
      <h3 style="color:var(--text); margin-bottom:12px; font-size:1.05rem;">Add Exercise</h3>
      
      <label style="font-size:0.8rem; color:var(--text-dim); display:block; margin-bottom:6px;">Choose Existing or New:</label>
      <select id="exerciseSelectDropdown" style="text-align:left; padding:10px; margin-bottom:12px;" onchange="handleModalDropdownChange(this.value)">
      </select>

      <div id="customExerciseInputGroup" style="display:none; margin-bottom:12px;">
        <label style="font-size:0.8rem; color:var(--text-dim); display:block; margin-bottom:6px;">New Exercise Name:</label>
        <input type="text" id="customExerciseInput" placeholder="e.g. Pull ups" style="text-align:left; padding:10px;">
      </div>

      <div style="display:flex; gap:8px; margin-top:16px;">
        <button type="button" class="btn btn-secondary" style="margin-top:0;" onclick="closeExerciseModal()">Cancel</button>
        <button type="button" class="btn" style="margin-top:0;" onclick="confirmAddExercise()">Add</button>
      </div>
    </div>
  </div>

  <script>
    const defaultExercises = ["Bench Press", "Barbell Squat", "Barbell Row", "Overhead Press"];

    let currentTab = 'workout';
    let calDate = new Date();
    let selectedCalDateStr = null;
    let editingLogId = null;

    function openSettingsModal() {
      document.getElementById('settingsModal').classList.add('active');
    }

    function closeSettingsModal() {
      document.getElementById('settingsModal').classList.remove('active');
    }

    function exportData() {
      const history = localStorage.getItem('ns_history') || '[]';
      const exercises = localStorage.getItem('gt_single_routine') || '[]';
      const theme = localStorage.getItem('gt_theme') || 'amber';
      
      const backup = JSON.stringify({ history, exercises, theme });
      navigator.clipboard.writeText(backup).then(() => {
        alert("Workout data copied to clipboard!");
      }).catch(() => {
        prompt("Copy this backup code manually:", backup);
      });
    }

    function importData() {
      const code = prompt("Paste your backup code here:");
      if (!code) return;
      try {
        const parsed = JSON.parse(code);
        if (parsed.history) localStorage.setItem('ns_history', parsed.history);
        if (parsed.exercises) localStorage.setItem('gt_single_routine', parsed.exercises);
        if (parsed.theme) localStorage.setItem('gt_theme', parsed.theme);
        alert("Data restored successfully!");
        location.reload();
      } catch (e) {
        alert("Invalid backup code.");
      }
    }

    function refreshApp() {
      const logo = document.getElementById('appLogo');
      if (logo) {
        logo.classList.remove('refreshing');
        void logo.offsetWidth;
        logo.classList.add('refreshing');
      }

      setTimeout(() => {
        window.location.reload();
      }, 250);
    }

    function applySavedTheme() {
      const savedTheme = localStorage.getItem('gt_theme') || 'purple';
      changeTheme(savedTheme);
    }

    function changeTheme(themeName) {
      document.documentElement.setAttribute('data-theme', themeName);
      localStorage.setItem('gt_theme', themeName);
      
      const themeSelect = document.getElementById('themeSelect');
      if (themeSelect) themeSelect.value = themeName;

      const bgHex = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
      const themeMeta = document.querySelector('meta[name="theme-color"]');
      if (themeMeta && bgHex) themeMeta.setAttribute('content', bgHex);

      if (currentTab === 'progress') renderChart();
    }

    function getExercises() {
      const saved = localStorage.getItem('gt_single_routine');
      return saved ? JSON.parse(saved) : defaultExercises;
    }

    function getAllKnownExercises() {
      const list = new Set(getExercises());
      const history = JSON.parse(localStorage.getItem('ns_history') || '[]');
      history.forEach(session => {
        session.entries.forEach(e => {
          if (e.exercise) list.add(e.exercise);
        });
      });
      return Array.from(list).sort((a, b) => a.localeCompare(b));
    }

    function switchTab(tab, evt) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      if (evt) {
        evt.target.classList.add('active');
      } else {
        const btnId = tab === 'workout' ? 'tabWorkoutBtn' : 'tabProgressBtn';
        const targetBtn = document.getElementById(btnId);
        if (targetBtn) targetBtn.classList.add('active');
      }
      
      if (tab === 'progress') editingLogId = null; 
      render();
    }

    function adjustValue(btn, step) {
      const group = btn.closest('.stepper-input-group');
      const input = group.querySelector('input');
      let currentVal = parseFloat(input.value) || 0;
      let newVal = currentVal + step;
      if (newVal < 0) newVal = 0;
      
      if (step === 2.5 || step === -2.5 || step === 1.25 || step === -1.25) {
        input.value = Math.round(newVal * 100) / 100;
      } else {
        input.value = newVal;
      }
    }

    function buildSetRowHTML(ex, setNum, valW = '', valR = '') {
      return `
        <div class="set-row" data-set-index="${setNum}">
          <input type="text" value="Set ${setNum}" readonly>
          <div class="stepper-input-group">
            <button type="button" class="step-btn" onclick="adjustValue(this, -2.5)">-</button>
            <input type="number" step="any" class="weight-input" placeholder="0" value="${valW}">
            <button type="button" class="step-btn" onclick="adjustValue(this, 2.5)">+</button>
          </div>
          <div class="stepper-input-group">
            <button type="button" class="step-btn" onclick="adjustValue(this, -1)">-</button>
            <input type="number" step="any" class="reps-input" placeholder="0" value="${valR}">
            <button type="button" class="step-btn" onclick="adjustValue(this, 1)">+</button>
          </div>
          <button type="button" class="btn-del" style="font-size:0.9rem;" onclick="removeSetRow(this)">✕</button>
        </div>
      `;
    }

    function addSetRow(btnElem, ex) {
      const card = btnElem.closest('.exercise-card-item');
      const rowsContainer = card.querySelector('.sets-rows-container');
      const currentCount = rowsContainer.querySelectorAll('.set-row').length;
      const nextNum = currentCount + 1;
      rowsContainer.insertAdjacentHTML('beforeend', buildSetRowHTML(ex, nextNum));
    }

    function removeSetRow(btnElem) {
      const row = btnElem.closest('.set-row');
      const rowsContainer = row.parentElement;
      row.remove();
      
      const rows = rowsContainer.querySelectorAll('.set-row');
      rows.forEach((r, idx) => {
        const labelInput = r.querySelector('input[type="text"]');
        if (labelInput) labelInput.value = `Set ${idx + 1}`;
      });
    }

    function buildExerciseCardHTML(ex, setsArray = []) {
      let rowsHTML = '';

      if (setsArray.length > 0) {
        setsArray.forEach((s, idx) => {
          rowsHTML += buildSetRowHTML(ex, idx + 1, s.weight, s.reps);
        });
      } else {
        rowsHTML += buildSetRowHTML(ex, 1);
        rowsHTML += buildSetRowHTML(ex, 2);
        rowsHTML += buildSetRowHTML(ex, 3);
      }

      return `
        <div class="card exercise-card-item" data-exercise-name="${ex}">
          <div class="card-title">
            <span>${ex}</span>
            <button type="button" class="btn-del" onclick="removeExerciseCard(this, '${ex}')">✕</button>
          </div>
          <div style="display:grid; grid-template-columns: 1.6fr 1.5fr 1.5fr 30px; gap:6px; margin-bottom:6px; font-size:0.75rem; color:var(--text-dim); text-align:center;">
            <span>Set</span><span>Kg (±2.5)</span><span>Reps (±1)</span><span></span>
          </div>
          <div class="sets-rows-container">
            ${rowsHTML}
          </div>
          <button type="button" class="btn btn-secondary" style="font-size:0.8rem; padding:6px; margin-top:4px;" onclick="addSetRow(this, '${ex}')">+ Add Set</button>
        </div>
      `;
    }

    function render() {
      const container = document.getElementById('workoutContainer');
      container.innerHTML = '';

      if (currentTab === 'progress') {
        renderProgress(container);
        return;
      }

      const history = JSON.parse(localStorage.getItem('ns_history') || '[]');
      const editingLog = editingLogId ? history.find(item => item.id === editingLogId) : null;

      const todayISO = editingLog ? editingLog.rawDate : new Date().toISOString().split('T')[0];

      let html = `<form id="workoutForm" onsubmit="saveWorkout(event)">`;
      
      html += `
        <div class="card date-picker-card">
          <label for="workoutDate">${editingLog ? 'Editing Workout Date:' : 'Workout Date:'}</label>
          <input type="date" id="workoutDate" name="workoutDate" value="${todayISO}" required>
        </div>
        <div id="exerciseCardsList">
      `;

      if (editingLog) {
        editingLog.entries.forEach(entry => {
          html += buildExerciseCardHTML(entry.exercise, entry.sets);
        });
      } else {
        const exercises = getExercises();
        exercises.forEach((ex) => {
          html += buildExerciseCardHTML(ex);
        });
      }

      html += `
        </div>
        <button type="button" class="btn btn-secondary" onclick="openExerciseModal()">+ Add Exercise</button>
        <button type="submit" class="btn" style="margin-top:16px;">${editingLog ? 'Update Workout' : 'Finish & Save Workout'}</button>
        ${editingLog ? `<button type="button" class="btn btn-secondary" style="margin-top:8px; color:var(--danger);" onclick="cancelEdit()">Cancel Edit</button>` : ''}
      </form>`;

      container.innerHTML = html;
    }

    function cancelEdit() {
      editingLogId = null;
      render();
    }

    function editHistoryItem(id) {
      editingLogId = id;
      switchTab('workout');
    }

    function changeMonth(offset) {
      calDate.setMonth(calDate.getMonth() + offset);
      selectedCalDateStr = null;
      render();
    }

    function openExerciseModal() {
      const known = getAllKnownExercises();
      const dropdown = document.getElementById('exerciseSelectDropdown');
      
      let optionsHTML = `<option value="__NEW__">+ Create New Exercise</option>`;
      if (known.length > 0) {
        optionsHTML += `<optgroup label="Select Previously Used">`;
        known.forEach(ex => {
          optionsHTML += `<option value="${ex}">${ex}</option>`;
        });
        optionsHTML += `</optgroup>`;
      }

      dropdown.innerHTML = optionsHTML;
      dropdown.value = known.length > 0 ? known[0] : '__NEW__';
      handleModalDropdownChange(dropdown.value);

      document.getElementById('customExerciseInput').value = '';
      document.getElementById('addExerciseModal').classList.add('active');
    }

    function closeExerciseModal() {
      document.getElementById('addExerciseModal').classList.remove('active');
    }

    function handleModalDropdownChange(val) {
      const group = document.getElementById('customExerciseInputGroup');
      if (val === '__NEW__') {
        group.style.display = 'block';
        document.getElementById('customExerciseInput').focus();
      } else {
        group.style.display = 'none';
      }
    }

    function confirmAddExercise() {
      const dropdownVal = document.getElementById('exerciseSelectDropdown').value;
      let name = '';

      if (dropdownVal === '__NEW__') {
        name = document.getElementById('customExerciseInput').value.trim();
        if (!name) {
          alert('Please enter an exercise name.');
          return;
        }
      } else {
        name = dropdownVal;
      }

      const existingCard = document.querySelector(`.exercise-card-item[data-exercise-name="${name}"]`);
      if (existingCard) {
        alert(`"${name}" is already in this workout card list.`);
        closeExerciseModal();
        return;
      }

      const exercises = getExercises();
      if (!exercises.includes(name)) {
        exercises.push(name);
        localStorage.setItem('gt_single_routine', JSON.stringify(exercises));
      }

      const listContainer = document.getElementById('exerciseCardsList');
      if (listContainer) {
        listContainer.insertAdjacentHTML('beforeend', buildExerciseCardHTML(name));
      } else {
        render();
      }

      closeExerciseModal();
    }

    function renderProgress(container) {
      const history = JSON.parse(localStorage.getItem('ns_history') || '[]');
      
      const exercisesSet = new Set();
      history.forEach(session => {
        session.entries.forEach(e => { if (e.exercise) exercisesSet.add(e.exercise); });
      });
      const uniqueExercises = Array.from(exercisesSet).sort((a,b) => a.localeCompare(b));

      let html = `
        <div class="card">
          <div class="card-title">
            <span>Strength Chart</span>
          </div>
          <select id="chartExSelect" class="theme-select" style="width:100%; max-width:100%; text-align:left; font-size:0.9rem; padding:8px;" onchange="renderChart()">
            ${uniqueExercises.length ? uniqueExercises.map(ex => `<option value="${ex}">${ex}</option>`).join('') : '<option value="">No history recorded yet</option>'}
          </select>
          <div class="chart-container">
            <canvas id="progressChart"></canvas>
          </div>
        </div>

        ${renderCalendarHTML(history)}
      `;

      container.innerHTML = html;
      renderChart();
    }

    function renderCalendarHTML(history) {
      const workoutDates = {};
      history.forEach(item => {
        const key = item.rawDate || new Date(item.date).toISOString().split('T')[0];
        workoutDates[key] = item;
      });

      const year = calDate.getFullYear();
      const month = calDate.getMonth();
      const firstDayIndex = new Date(year, month, 1).getDay();
      const totalDays = new Date(year, month + 1, 0).getDate();
      const monthName = calDate.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });

      let html = `
        <div class="card">
          <div class="cal-header">
            <button type="button" onclick="changeMonth(-1)">‹</button>
            <strong style="color:var(--accent); font-size:1rem; font-weight:700;">${monthName}</strong>
            <button type="button" onclick="changeMonth(1)">›</button>
          </div>
          <div class="cal-grid">
            <div class="cal-day-label">S</div><div class="cal-day-label">M</div><div class="cal-day-label">T</div>
            <div class="cal-day-label">W</div><div class="cal-day-label">T</div><div class="cal-day-label">F</div>
            <div class="cal-day-label">S</div>
      `;

      for (let i = 0; i < firstDayIndex; i++) {
        html += `<div class="cal-day empty"></div>`;
      }

      for (let day = 1; day <= totalDays; day++) {
        const mStr = String(month + 1).padStart(2, '0');
        const dStr = String(day).padStart(2, '0');
        const dateKey = `${year}-${mStr}-${dStr}`;

        const hasWorkout = workoutDates[dateKey] ? 'has-workout' : '';
        const isSelected = selectedCalDateStr === dateKey ? 'selected' : '';

        html += `<div class="cal-day ${hasWorkout} ${isSelected}" onclick="inspectCalDate('${dateKey}')"><span>${day}</span></div>`;
      }

      html += `</div></div>`;

      html += `<div id="calInspector">`;
      if (selectedCalDateStr && workoutDates[selectedCalDateStr]) {
        html += renderSingleWorkoutCard(workoutDates[selectedCalDateStr]);
      } else if (selectedCalDateStr) {
        html += `<div class="card" style="text-align:center; padding: 20px 16px;"><p style="color:var(--text-dim); font-size:0.9rem;">No workout logged for this date.</p></div>`;
      }
      html += `</div>`;

      return html;
    }

    function renderChart() {
      const canvas = document.getElementById('progressChart');
      if (!canvas) return;
      const select = document.getElementById('chartExSelect');
      const selectedEx = select ? select.value : null;

      const ctx = canvas.getContext('2d');
      
      canvas.width = canvas.offsetWidth * window.devicePixelRatio;
      canvas.height = canvas.offsetHeight * window.devicePixelRatio;
      ctx.scale(window.devicePixelRatio, window.devicePixelRatio);

      const w = canvas.offsetWidth;
      const h = canvas.offsetHeight;
      ctx.clearRect(0, 0, w, h);

      if (!selectedEx) {
        ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--text-dim').trim() || '#a0a0a0';
        ctx.font = "12px -apple-system, sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("Log workouts to display progress trends.", w / 2, h / 2);
        return;
      }

      const history = JSON.parse(localStorage.getItem('ns_history') || '[]');
      const points = [];

      history.slice().reverse().forEach(session => {
        const match = session.entries.find(e => e.exercise === selectedEx);
        if (match) {
          let top1RM = 0;
          match.sets.forEach(set => {
            const weight = parseFloat(set.weight) || 0;
            const reps = parseFloat(set.reps) || 0;
            if (weight > 0 && reps > 0) {
              const e1rm = weight * (1 + reps / 30);
              if (e1rm > top1RM) top1RM = e1rm;
            }
          });
          if (top1RM > 0) {
            const dateObj = new Date(session.rawDate || session.date);
            points.push({
              date: `${dateObj.getMonth() + 1}/${dateObj.getDate()}`,
              val: Math.round(top1RM)
            });
          }
        }
      });

      if (points.length < 2) {
        ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--text-dim').trim() || '#a0a0a0';
        ctx.font = "12px -apple-system, sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(`Log ${selectedEx} across multiple sessions to see chart.`, w / 2, h / 2);
        return;
      }

      const padL = 35, padR = 20, padT = 20, padB = 25;
      const chartW = w - padL - padR;
      const chartH = h - padT - padB;

      const minV = Math.min(...points.map(p => p.val)) * 0.9;
      const maxV = Math.max(...points.map(p => p.val)) * 1.1;

      const getX = i => padL + (i / (points.length - 1)) * chartW;
      const getY = v => padT + chartH - ((v - minV) / (maxV - minV)) * chartH;

      const accentColor = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#bb86fc';
      const dimColor = getComputedStyle(document.documentElement).getPropertyValue('--card-border').trim() || '#2e2e2e';

      ctx.strokeStyle = dimColor;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(padL, h - padB); ctx.lineTo(w - padR, h - padB);
      ctx.stroke();

      ctx.strokeStyle = accentColor;
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      points.forEach((pt, i) => {
        const x = getX(i), y = getY(pt.val);
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      });
      ctx.stroke();

      points.forEach((pt, i) => {
        const x = getX(i), y = getY(pt.val);
        ctx.fillStyle = accentColor;
        ctx.beginPath();
        ctx.arc(x, y, 4, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--text-dim').trim() || '#a0a0a0';
        ctx.font = "10px -apple-system, sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(pt.date, x, h - 8);
        ctx.fillText(`${pt.val}`, x, y - 8);
      });
    }

    function inspectCalDate(dateStr) {
      selectedCalDateStr = dateStr;
      render();
    }

    function renderSingleWorkoutCard(item) {
      let html = `
        <div class="inspector-card">
          <div class="card-title">
            <div>
              <span style="font-size:0.8rem; text-transform:uppercase; letter-spacing:0.8px; color:var(--accent);">WORKOUT SESSION</span>
              <div class="history-date">${item.date}</div>
            </div>
            <div>
              <button class="btn-action-log" onclick="editHistoryItem(${item.id})">Edit</button>
              <button class="btn-action-log btn-delete-log" onclick="deleteHistoryItem(${item.id})">Delete</button>
            </div>
          </div>`;
      item.entries.forEach(entry => {
        const setStr = entry.sets.map(s => `${s.weight}kg × ${s.reps}`).join(' | ');
        html += `
          <div class="history-item">
            <strong style="font-size:0.9rem; color:var(--text);">${entry.exercise}</strong>
            <div style="font-size:0.85rem; color:var(--text-dim); margin-top:2px;">${setStr}</div>
          </div>`;
      });
      html += `</div>`;
      return html;
    }

    function removeExerciseCard(buttonElem, exName) {
      const card = buttonElem.closest('.card');
      if (card) card.remove();

      if (!editingLogId) {
        const exercises = getExercises();
        const updatedExercises = exercises.filter(ex => ex !== exName);
        localStorage.setItem('gt_single_routine', JSON.stringify(updatedExercises));
      }
    }

    function saveWorkout(e) {
      e.preventDefault();
      
      const rawDate = document.getElementById('workoutDate').value;
      const selectedDate = new Date(rawDate + 'T00:00:00');
      const formattedDate = selectedDate.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });

      const log = {
        id: editingLogId ? editingLogId : Date.now(),
        date: formattedDate,
        rawDate: rawDate,
        entries: []
      };

      document.querySelectorAll('.exercise-card-item').forEach(card => {
        const ex = card.getAttribute('data-exercise-name');
        const sets = [];
        
        card.querySelectorAll('.set-row').forEach(row => {
          const weightInput = row.querySelector('.weight-input');
          const repsInput = row.querySelector('.reps-input');
          const w = weightInput ? weightInput.value : '';
          const r = repsInput ? repsInput.value : '';
          if (w || r) sets.push({ weight: w || 0, reps: r || 0 });
        });

        if (sets.length > 0) log.entries.push({ exercise: ex, sets });
      });

      if (log.entries.length === 0) {
        alert("Please log at least one set before saving.");
        return;
      }

      let history = JSON.parse(localStorage.getItem('ns_history') || '[]');
      const wasEditing = Boolean(editingLogId);

      if (editingLogId) {
        const index = history.findIndex(item => item.id === editingLogId);
        if (index !== -1) history[index] = log;
        editingLogId = null;
      } else {
        history.push(log);
      }

      history.sort((a, b) => new Date(b.rawDate || b.date) - new Date(a.rawDate || a.date));
      localStorage.setItem('ns_history', JSON.stringify(history));

      alert(wasEditing ? "Workout updated!" : "Workout saved successfully!");

      switchTab('progress');
    }

    function deleteHistoryItem(id) {
      let history = JSON.parse(localStorage.getItem('ns_history') || '[]');
      history = history.filter(item => item.id !== id);
      localStorage.setItem('ns_history', JSON.stringify(history));
      selectedCalDateStr = null;
      render();
    }

    applySavedTheme();
    render();
  </script>
</body>
</html>
